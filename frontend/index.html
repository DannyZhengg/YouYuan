<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouYuan</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 0 20px;
      background: #0a0a0a;
      color: #eee;
    }
    h1 { color: #c0392b; }
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #eee;
      border-radius: 6px;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      background: #c0392b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .card {
      margin-top: 20px;
      padding: 16px;
      background: #151515;
      border-radius: 8px;
      border-left: 3px solid #c0392b;
    }
    .card h3 { margin: 0 0 6px; }
    .meta { color: #999; font-size: 14px; }
  </style>
</head>
<body>
  <h1>YouYuan 有缘</h1>
  <p>Tell me what you're looking for.</p>
  <input id="query" type="text" placeholder="wuxia action" />
  <button onclick="doSearch()">Find Dramas</button>

  <div id="results"></div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";

    async function doSearch() {
      const query = document.getElementById("query").value;
      if (!query) return;

      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "<p>Searching...</p>";

      const res = await fetch(`${API_BASE}/api/recommend?q=${encodeURIComponent(query)}&k=5`);
      const data = await res.json();

      resultsDiv.innerHTML = data.results.map(r => `
        <div class="card">
          <h3>${r.title}</h3>
          <div class="meta">${r.content_type} · ${Math.round(r.similarity * 100)}% match</div>
          <p>${r.synopsis}...</p>
        </div>
      `).join("");
    }
  </script>
</body>
</html>
